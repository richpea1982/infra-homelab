---
k3s_version: "v1.30.2+k3s1"
k3s_api_server: "10.0.10.21"
k3s_api_port: 6443

# Network Overlays
k3s_cluster_cidr: "10.42.0.0/16"

# Helm Chart Tracking Versions — Ansible-managed bootstrap components only.
# Everything past this point (Traefik, CrowdSec, future workloads) is
# version-pinned inside k3s/gitops/apps/*.yaml instead, and reconciled by
# ArgoCD, not Ansible.
calico_helm_version: "3.32.0"
argocd_helm_version: "7.7.11"

# GitOps repo — ArgoCD's root Application watches this path for everything
# deployed after bootstrap.
gitops_repo_url: "https://github.com/richpea1982/infra-homelab.git"
gitops_repo_path: "k3s/gitops/apps"
gitops_repo_revision: "main"
