---
- name: Orchestrate K3s Node Join
  hosts: k3s_cluster
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all/vault.yml

  tasks:
    - name: Orchestrate K3s Node Join
      ansible.builtin.import_role:
        name: apt_mirror
    - name: Join existing cluster or rejoin as existing member
      ansible.builtin.import_role:
        name: k3s_cluster
        tasks_from: rejoin
