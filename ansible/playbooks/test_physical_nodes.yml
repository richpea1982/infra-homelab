---
- name: Verify SSH connectivity and privilege escalation on physical hosts
  hosts: physical_nodes
  gather_facts: false

  tasks:
    - name: Confirm SSH connection works (no privilege escalation yet)
      ansible.builtin.ping:

    - name: Confirm root/sudo access works
      ansible.builtin.command: whoami
      become: true
      register: whoami_result
      changed_when: false

    - name: Report effective privileged user per host
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> become resolves to: {{ whoami_result.stdout }}"
