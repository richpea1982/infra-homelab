---
- name: Refresh SSH host keys for K3s nodes
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove stale known_hosts entries for both names and IPs
      ansible.builtin.known_hosts:
        path: /root/.ssh/known_hosts
        name: "{{ item }}"
        state: absent
      loop: >-
        {{ groups['k3s_cluster'] +
        [hostvars[groups['k3s_cluster'][0]].ansible_host,
        hostvars[groups['k3s_cluster'][1]].ansible_host,
        hostvars[groups['k3s_cluster'][2]].ansible_host] }}

    - name: Scan and trust the current SSH host key for each K3s node IP
      ansible.builtin.command: "ssh-keyscan -T 10 {{ hostvars[item]['ansible_host'] }}"
      with_items: "{{ groups['k3s_cluster'] }}"
      changed_when: false

- name: Orchestrate HA K3s Cluster Provisioning
  hosts: k3s_cluster
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all/vault.yml

  roles:
    - role: apt_mirror
    - role: k3s_cluster
