---
- name: Ensure legacy iptables alternative mappings are active
  community.general.alternatives:
    name: iptables
    path: /usr/sbin/iptables-legacy
  loop:
    - iptables
    - ip6tables
    - arptables
    - ebtables
  loop_control:
    loop_var: item

- name: Verify systemd-resolved DNS loop protections
  stat:
    path: /etc/resolv.conf
  register: resolv_conf_stat

- name: Ensure standard upstream nameserver fallback is declared
  copy:
    dest: /etc/rancher/k3s/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
    mode: '0644'
    owner: root
    group: root
  # Ensure the target folder paths exist before executing
  before:
    file:
      path: /etc/rancher/k3s
      state: directory
      mode: '0755'

- name: Turn off swap space completely for kubelet stability
  command: swapoff -a
  changed_when: false
