---
# Rejoin an existing, live K3s cluster via the VIP.
# Used by the primary (via primary-node.yml) when the VIP is answering,
# and by every secondary unconditionally.
#
# Single-node recovery path:
#   1. Defensive cleanup of any leftover local state
#   2. Confirm VIP is reachable (cluster is alive)
#   3. Evict the stale etcd member + Node object from ONE surviving peer
#      (etcd state is shared — only one peer needs to run the removal)
#   4. Write config pointing at the VIP and join

- name: Check if K3s service is already active on this node
  ansible.builtin.systemd:
    name: k3s
  register: k3s_local_status
  failed_when: false

- name: Set fact — is K3s already running here?
  ansible.builtin.set_fact:
    k3s_already_running: "{{ k3s_local_status.status is defined and k3s_local_status.status.ActiveState == 'active' }}"

- name: Defensive cleanup of any prior k3s state before joining
  ansible.builtin.include_tasks: cleanup-stale-state.yml
  when: not k3s_already_running

- name: Wait for the VIP to be reachable before attempting to join
  ansible.builtin.uri:
    url: "https://{{ k3s_api_server }}:{{ k3s_api_port }}/readyz"
    validate_certs: false
    status_code: [200, 401, 403]
    timeout: 5
  register: vip_probe
  retries: 30
  delay: 10
  until: (vip_probe.status | default(0)) in [200, 401, 403]
  when: not k3s_already_running

# ------------------------------------------------------------------
# Evict stale etcd member + Kubernetes Node object from the live
# quorum. etcd state is shared — only ONE live peer runs the removal.
#
# Prefer the primary (k3s_node_index == 1) when it is not the node
# being rejoined; otherwise use any other inventory host.
# ------------------------------------------------------------------
- name: Evict this node's stale etcd membership and Node object
  when: not k3s_already_running
  block:
    - name: Set target identity for eviction
      ansible.builtin.set_fact:
        target_node_name: "{{ inventory_hostname }}"
        target_node_ip: "{{ ansible_host }}"

    - name: Build list of other cluster members
      ansible.builtin.set_fact:
        other_peers: "{{ groups['k3s_cluster'] | difference([inventory_hostname]) }}"

    - name: Prefer primary peer (k3s_node_index == 1) when available
      ansible.builtin.set_fact:
        eviction_peer: "{{ item }}"
      loop: "{{ other_peers }}"
      when:
        - hostvars[item].k3s_node_index is defined
        - (hostvars[item].k3s_node_index | int) == 1
      loop_control:
        label: "{{ item }}"

    - name: Fall back to first other peer if primary is the one being rejoined
      ansible.builtin.set_fact:
        eviction_peer: "{{ other_peers | first }}"
      when: eviction_peer is not defined

    - name: Run eviction on the selected peer
      ansible.builtin.include_tasks: evict-stale-member.yml

- name: Write k3s config.yaml for joining/rejoining this node
  ansible.builtin.template:
    src: k3s-server-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: '0600'
  vars:
    k3s_config_server_url: "https://{{ k3s_api_server }}:{{ k3s_api_port }}"
  when: not k3s_already_running

- name: Join existing cluster via the VIP
  ansible.builtin.shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server
  when: not k3s_already_running

- name: Ensure k3s service is verified running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for local API server port to accept connections
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ k3s_api_port }}"
    delay: 5
    timeout: 60
