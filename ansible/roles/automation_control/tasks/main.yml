---
- name: Update apt cache and install base essentials
  ansible.builtin.apt:
    name: "{{ automation_control_essential_packages }}"
    state: present
    update_cache: true

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

# --- Install Terraform ---
- name: Download HashiCorp GPG apt Key
  ansible.builtin.get_url:
    url: "{{ automation_control_terraform_gpg_url }}"
    dest: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    mode: "0644"

- name: Add HashiCorp Repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] {{
      automation_control_terraform_repo_url }} {{ ansible_distribution_release }} main"
    state: present
    filename: hashicorp

- name: Install Terraform
  ansible.builtin.apt:
    name: terraform
    state: present

# --- Install Ansible via Pipx (Debian 13 PEP 668 Compliant) ---
- name: Install pipx via apt
  ansible.builtin.apt:
    name: pipx
    state: present

- name: Check if pipx global path is already in environment
  ansible.builtin.command: grep -q "/usr/local/bin" /etc/environment
  register: automation_control_pipx_path_check
  failed_when: false
  changed_when: false

- name: Ensure pipx global path is configured for the user
  ansible.builtin.command: pipx ensurepath --global
  become: true
  when: automation_control_pipx_path_check.rc != 0

- name: Install Ansible core and community collections via pipx
  ansible.builtin.command: pipx install --global --include-deps ansible
  args:
    creates: /usr/local/bin/ansible-playbook

# --- Install Ansible-Semaphore (Official GitHub Package Method) ---
- name: Fetch latest Semaphore release metadata
  ansible.builtin.uri:
    url: "{{ automation_control_semaphore_api_url }}"
    return_content: true
  register: automation_control_semaphore_meta

- name: Extract exact download URL for the amd64 deb package
  ansible.builtin.set_fact:
    automation_control_semaphore_deb_url: >-
      {{
        (automation_control_semaphore_meta.content | from_json).assets
        | selectattr('name', 'search', '_linux_amd64.deb')
        | map(attribute='browser_download_url')
        | first
      }}

- name: Download latest Semaphore .deb package dynamically
  ansible.builtin.get_url:
    url: "{{ automation_control_semaphore_deb_url }}"
    dest: "/tmp/semaphore_latest_amd64.deb"
    mode: "0644"

- name: Install Semaphore via local apt package file
  ansible.builtin.apt:
    deb: "/tmp/semaphore_latest_amd64.deb"
    state: present

# --- Configure & Initialize Semaphore ---
- name: Ensure Semaphore configuration directory exists
  ansible.builtin.file:
    path: /etc/semaphore
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Data directory exists
  ansible.builtin.file:
    path: /var/lib/semaphore
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure SQLite database file physically exists
  ansible.builtin.file:
    path: /var/lib/semaphore/database.sqlite
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Deploy Semaphore configuration from Vault template
  ansible.builtin.template:
    src: semaphore_config.json.j2
    dest: /etc/semaphore/config.json
    owner: root
    group: root
    mode: "0640"

- name: Run Semaphore database migrations
  ansible.builtin.command: /usr/bin/semaphore migrate --config /etc/semaphore/config.json
  register: automation_control_migrate_result
  changed_when: automation_control_migrate_result.rc == 0

- name: Initialize Semaphore Admin User
  ansible.builtin.command: >
    /usr/bin/semaphore user add --admin
    --login rich
    --name '{{ automation_control_semaphore_user }}'
    --email '{{ automation_control_semaphore_email }}'
    --password '{{ vault_semaphore_admin_password }}'
    --config /etc/semaphore/config.json
  register: automation_control_user_result
  failed_when:
    - automation_control_user_result.rc != 0
    - "'user already exists' not in automation_control_user_result.stderr"
    - "'user already exists' not in automation_control_user_result.stdout"
    - "'UNIQUE constraint failed' not in automation_control_user_result.stderr" # Catches the Go panic
  changed_when:
    - automation_control_user_result.rc == 0

- name: Force update admin password if user already exists
  ansible.builtin.command: >
    /usr/bin/semaphore user change-by-login
    --login rich
    --password '{{ vault_semaphore_admin_password }}'
    --config /etc/semaphore/config.json
  when: >
    automation_control_user_result.rc != 0 and
    ('user already exists' in automation_control_user_result.stderr or
     'user already exists' in automation_control_user_result.stdout or
     'UNIQUE constraint failed' in automation_control_user_result.stderr)
  changed_when: true

- name: Deploy Semaphore Systemd Service File
  ansible.builtin.copy:
    dest: /etc/systemd/system/semaphore.service
    mode: "0644"
    content: |
      [Unit]
      Description=Ansible Semaphore UI
      After=network.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/bin/semaphore service --config /etc/semaphore/config.json
      Restart=always

      [Install]
      WantedBy=multi-user.target
  register: automation_control_systemd_file

- name: Enable and start Semaphore service
  ansible.builtin.systemd:
    name: semaphore
    state: started
    enabled: true
    daemon_reload: "{{ automation_control_systemd_file.changed }}"
