---
# GLPI-Agent isn't in Debian/Ubuntu's official repos — installed from the
# checksum-verified .deb release on GitHub, same pattern as
# smartctl_exporter. Verify this version against
# https://github.com/glpi-project/glpi-agent/releases before applying —
# same "don't trust a pinned version blindly" rule as everywhere else in
# this repo.
glpi_agent_version: "1.19"

# The Debian package carries its own revision suffix independent of the
# agent version (e.g. glpi-agent_1.19-1_all.deb) — bumped when
# Debian-packaging-specific fixes ship without a full agent release.
# Check the release page's "Debian/Ubuntu packages" table if a download
# 404s; the agent version bump alone doesn't guarantee this stays "1".
glpi_agent_deb_revision: "1"

# Native GLPI 10+ inventory endpoint — internal-only IngressRoute,
# protected by the glpi-admin-only ipAllowList (VLAN10/WireGuard/
# Tailscale) and the crowdsec-bouncer middleware, same as browser access.
glpi_agent_server_url: "https://glpi.pearsalls.fr/front/inventory.php"

# glpi.pearsalls.fr has no public DNS record (Unbound split-horizon DNS
# isn't live yet) — Traefik's LoadBalancer VIP is what /etc/hosts needs
# to point at in the meantime. Remove this task's effect (or point it at
# an internal resolver instead) once split-horizon DNS lands.
glpi_agent_hosts_entry_ip: "10.0.20.24"

# How often the agent re-runs inventory and pushes to the server.
glpi_agent_delaytime: "3600"

# Disables the agent's local httpd listener (port 62354, used for
# remote-triggered inventory pulls from the server). Not needed for a
# scheduled push-only model, and reduces attack surface — verify this is
# still the correct key name for your installed version if inventory
# pushes silently stop working after a version bump.
glpi_agent_no_httpd: true

# Tag applied to every inventoried device — lets you filter/group by
# this fleet in GLPI's asset views without relying solely on hostname.
glpi_agent_tag: "homelab"
