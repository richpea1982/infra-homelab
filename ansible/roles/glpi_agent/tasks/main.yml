---
- name: Ensure prerequisite packages are present
  ansible.builtin.apt:
    name:
      - ca-certificates
      - libnet-ssleay-perl
      - libio-socket-ssl-perl
    state: present
    update_cache: true

# glpi.pearsalls.fr deliberately has no public A/CNAME record (same
# pattern as vault.pearsalls.fr / photos.pearsalls.fr — a real subdomain
# for the Let's Encrypt DNS-01 cert, resolved only via manual /etc/hosts
# until Unbound split-horizon DNS is live on OPNsense). Every host
# running the agent needs this entry, or the prolog request fails with
# "Name or service not known" before it ever reaches the network layer.
- name: Ensure /etc/hosts resolves glpi.pearsalls.fr until split-horizon DNS is live
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\sglpi\.pearsalls\.fr$'
    line: "{{ glpi_agent_hosts_entry_ip }} glpi.pearsalls.fr"
    state: present

- name: Download GLPI-Agent .deb package (checksum-verified against upstream .sha256)
  ansible.builtin.get_url:
    url: "https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_version }}/glpi-agent_{{ glpi_agent_version }}-{{ glpi_agent_deb_revision }}_all.deb"
    dest: "/tmp/glpi-agent_{{ glpi_agent_version }}-{{ glpi_agent_deb_revision }}_all.deb"
    # Same pattern as smartctl_exporter: Ansible fetches the .sha256 file,
    # finds the line matching the downloaded filename, verifies against
    # it — no hardcoded hash to go stale on a version bump.
    checksum: "sha256:https://github.com/glpi-project/glpi-agent/releases/download/{{ glpi_agent_version }}/glpi-agent-{{ glpi_agent_version }}.sha256"
    mode: '0644'

- name: Install GLPI-Agent package
  ansible.builtin.apt:
    deb: "/tmp/glpi-agent_{{ glpi_agent_version }}-{{ glpi_agent_deb_revision }}_all.deb"
    state: present

- name: Ensure GLPI-Agent config directory exists
  ansible.builtin.file:
    path: /etc/glpi-agent
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy GLPI-Agent configuration
  ansible.builtin.template:
    src: agent.cfg.j2
    dest: /etc/glpi-agent/agent.cfg
    owner: root
    group: root
    mode: '0644'
  notify: restart glpi-agent

- name: Enable and start glpi-agent service
  ansible.builtin.systemd:
    name: glpi-agent
    state: started
    enabled: true
