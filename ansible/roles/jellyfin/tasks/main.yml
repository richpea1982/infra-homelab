---
# roles/jellyfin/tasks/main.yml
# Provisioning tasks for Jellyfin LXC. Uses direct .list file writes for apt sources
# to avoid ansible version differences around deb822_repository/apt_repository.

- name: Resolve the Debian release codename used for apt sources
  ansible.builtin.set_fact:
    jellyfin_suite: >-
      {{ ansible_facts['distribution_release'] |
        default(ansible_facts['lsb']['codename'] | default('bookworm')) }}

- name: Verify GPU device nodes were actually passed through
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /dev/dri/card1
    - /dev/dri/renderD128
  register: jellyfin_gpu_device_check

- name: Fail if no GPU device nodes were passed through
  ansible.builtin.fail:
    msg: "Expected GPU device nodes not present: ensure Proxmox device_passthrough is configured for this container."
  when: >
    (jellyfin_gpu_device_check.results | selectattr('stat.exists') | list | length) == 0

- name: Determine if any GPU device node exists
  ansible.builtin.set_fact:
    jellyfin_gpu_present: "{{ (jellyfin_gpu_device_check.results | selectattr('stat.exists') | list | length) > 0 }}"

- name: Ensure Debian non-free sources list exists (fallback for older Ansible)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian_nonfree.list
    content: |
      deb http://deb.debian.org/debian {{ jellyfin_suite }} main contrib non-free
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure Debian security non-free sources list exists (fallback)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian_nonfree_security.list
    content: |
      deb http://security.debian.org/debian-security {{ jellyfin_suite }}-security main contrib non-free
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Update apt cache after adding non-free repos
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Try to install available VAAPI/QSV packages (only if GPU present)
  become: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - jellyfin_gpu_present

  block:
    - name: Attempt to install candidate VAAPI packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - intel-media-va-driver-non-free
        - intel-media-va-driver
        - i965-va-driver
        - vainfo
        - nfs-common
      register: jellyfin_va_install_results
      failed_when: false

    - name: Set jellyfin_va_installed fact if any candidate is present or was installed
      ansible.builtin.set_fact:
        jellyfin_va_installed: >-
          {{ (jellyfin_va_install_results.results | selectattr('changed') | list | length) > 0
             or (jellyfin_va_install_results.results | selectattr('rc', 'defined')
                 | selectattr('rc', 'equalto', 0) | list | length) > 0 }}

    - name: Debug VA install results (helpful when troubleshooting)
      ansible.builtin.debug:
        var: jellyfin_va_install_results
      when: jellyfin_va_install_results is defined and jellyfin_va_install_results.results | length > 0

    - name: Fail if GPU present but no VAAPI package available
      ansible.builtin.fail:
        msg: >
          No VAAPI package available in apt sources. Ensure non-free is enabled
          in the template or use a different template/storage.
      when: not jellyfin_va_installed
- name: Install VAAPI/QSV userspace driver and diagnostic tools (ensure vainfo present if available)
  become: true
  ansible.builtin.apt:
    name:
      - vainfo
    state: present
    update_cache: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - jellyfin_gpu_present
    - jellyfin_va_installed | default(false)

- name: Verify QSV profiles are visible via vainfo (fails loudly if passthrough is broken at the driver level)
  ansible.builtin.command: vainfo
  register: jellyfin_vainfo_result
  changed_when: false
  failed_when: "'VAProfile' not in jellyfin_vainfo_result.stdout"
  when:
    - jellyfin_gpu_present
    - jellyfin_va_installed | default(false)

- name: Ensure media library mount points exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /mnt/jellyfin-media
    - /mnt/jellyfin-media/dvds
    - /mnt/jellyfin-media/music

- name: Mount NAS-backed media library exports (matches nas_setup's jellyfin/dvds/music datasets)
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "10.0.10.15:{{ item.export }}"
    fstype: nfs
    opts: "rw,soft,timeo=30"
    state: mounted
  loop:
    - { path: /mnt/jellyfin-media, export: /mnt/storage/jellyfin }
    - { path: /mnt/jellyfin-media/dvds, export: /mnt/storage/jellyfin/dvds }
    - { path: /mnt/jellyfin-media/music, export: /mnt/storage/jellyfin/music }

- name: Add Jellyfin apt repository signing key
  become: true
  ansible.builtin.get_url:
    url: https://repo.jellyfin.org/jellyfin_team.gpg.key
    dest: /usr/share/keyrings/jellyfin.gpg
    mode: "0644"

- name: Add Jellyfin apt repository (fallback .list)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/jellyfin.list
    content: |
      deb [signed-by=/usr/share/keyrings/jellyfin.gpg] https://repo.jellyfin.org/debian {{ jellyfin_suite }} main
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Update apt cache after adding jellyfin repo
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install Jellyfin
  ansible.builtin.apt:
    name: jellyfin
    state: present
    update_cache: true

- name: Ensure container has a group matching the device node's numeric GID and add jellyfin to it
  when: jellyfin_gpu_present
  block:
    - name: Stat device node to get numeric GID
      ansible.builtin.stat:
        path: /dev/dri/renderD128
      register: jellyfin_render_dev_stat
      when: jellyfin_gpu_present

    - name: Set jellyfin_device_gid fact
      ansible.builtin.set_fact:
        jellyfin_device_gid: "{{ jellyfin_render_dev_stat.stat.gid | int }}"
      when:
        - jellyfin_gpu_present
        - jellyfin_render_dev_stat.stat is defined

    - name: Lookup group name for jellyfin_device_gid (if any)
      ansible.builtin.command:
        cmd: "getent group {{ jellyfin_device_gid }}"
      register: jellyfin_getent_group
      failed_when: false
      changed_when: false
      when: jellyfin_device_gid is defined

    - name: Set jellyfin_existing_group_name fact if getent returned a group
      ansible.builtin.set_fact:
        jellyfin_existing_group_name: >-
          {{ (jellyfin_getent_group.stdout.split(':')[0]) if (jellyfin_getent_group.stdout | length > 0)
          else '' }}
      when: jellyfin_device_gid is defined

    - name: Create group with host device GID if none exists
      ansible.builtin.group:
        name: "{{ jellyfin_existing_group_name | default('render') }}"
        gid: "{{ jellyfin_device_gid }}"
        state: present
      when:
        - jellyfin_device_gid is defined
        - jellyfin_existing_group_name == ''

    - name: Add jellyfin user to device group (by name)
      ansible.builtin.user:
        name: jellyfin
        groups: "{{ jellyfin_existing_group_name | default('render') }}"
        append: true
      when: jellyfin_device_gid is defined

    - name: Restart jellyfin to pick up new group membership
      ansible.builtin.systemd:
        name: jellyfin
        state: restarted
      when: jellyfin_device_gid is defined
