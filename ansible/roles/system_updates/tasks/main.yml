---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Apply upgrades
  ansible.builtin.apt:
    upgrade: "{{ 'dist' if system_updates_dist_upgrade else 'safe' }}"

- name: Remove unused packages
  ansible.builtin.apt:
    autoremove: true
  when: system_updates_autoremove

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Report reboot status
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} requires a reboot"
  when: reboot_required_file.stat.exists

- name: Reboot if required and allowed
  ansible.builtin.reboot:
    reboot_timeout: 300
  when:
    - reboot_required_file.stat.exists
    - system_updates_reboot_if_required
