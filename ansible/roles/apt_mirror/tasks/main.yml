---
- name: Deploy deb822 sources file pointing at the local apt-mirror
  ansible.builtin.template:
    src: debian.sources.j2
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: "0644"
  notify: Refresh apt cache against the new sources

# Debian cloud images (and older bookworm LXCs) may still ship a classic
# sources.list — deb822 + sources.list both active means duplicate entries
# and apt update warnings. Disable it rather than delete, so a rollback
# just means renaming it back.
- name: Check for a legacy sources.list
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: apt_mirror_legacy_sources_list

- name: Disable legacy sources.list if present and non-empty
  ansible.builtin.command:
    cmd: mv /etc/apt/sources.list /etc/apt/sources.list.disabled-by-apt-mirror
  when:
    - apt_mirror_legacy_sources_list.stat.exists
    - apt_mirror_legacy_sources_list.stat.size > 0
  changed_when: true

# Flush immediately: roles that follow in the same play (e.g. jellyfin,
# which installs from this mirror) rely on a fresh apt cache. A plain
# end-of-play handler would run too late for their apt installs.
- name: Refresh the apt cache before downstream package work
  ansible.builtin.meta: flush_handlers
