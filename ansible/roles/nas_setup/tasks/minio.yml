---
- name: Create MinIO system group
  ansible.builtin.group:
    name: "{{ nas_setup_minio_group }}"
    system: true

- name: Create MinIO system user
  ansible.builtin.user:
    name: "{{ nas_setup_minio_user }}"
    group: "{{ nas_setup_minio_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download MinIO binary
  ansible.builtin.get_url:
    url: "{{ nas_setup_minio_download_url }}"
    dest: /usr/local/bin/minio
    mode: "0755"
    owner: root
    group: root

- name: Ensure MinIO configuration directory exists
  ansible.builtin.file:
    path: /etc/minio
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy MinIO environment configuration
  no_log: true
  ansible.builtin.copy:
    dest: /etc/minio/minio.env
    content: |
      MINIO_VOLUMES="{{ nas_setup_nas_mount_point_base }}/minio"
      MINIO_OPTS="--address :9000 --console-address :9001"
      MINIO_ROOT_USER="{{ vault_minio_root_user }}"
      MINIO_ROOT_PASSWORD="{{ vault_minio_root_password }}"
    owner: root
    group: "{{ nas_setup_minio_group }}"
    mode: "0640"
  register: nas_setup_minio_env_updated

- name: Fix ownership of ZFS MinIO data directory
  ansible.builtin.file:
    path: "{{ nas_setup_nas_mount_point_base }}/minio"
    state: directory
    owner: "{{ nas_setup_minio_user }}"
    group: "{{ nas_setup_minio_group }}"
    mode: "0750"
    recurse: false

- name: Deploy MinIO systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/minio.service
    mode: "0644"
    content: |
      [Unit]
      Description=MinIO High Performance Object Storage
      Documentation=https://docs.min.io
      After=network.target
      AssertFileIsExecutable=/usr/local/bin/minio

      [Service]
      Type=simple
      User={{ nas_setup_minio_user }}
      Group={{ nas_setup_minio_group }}
      ProtectProc=invisible
      EnvironmentFile=/etc/minio/minio.env
      ExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
      Restart=always
      LimitNOFILE=65536
      TasksMax=infinity
      TimeoutStopSec=infinity
      SendSIGKILL=no

      [Install]
      WantedBy=multi-user.target
  register: nas_setup_minio_service_updated

- name: Enable and start MinIO service
  ansible.builtin.systemd:
    name: minio
    state: started
    enabled: true
    daemon_reload: "{{ nas_setup_minio_service_updated.changed }}"

- name: Restart MinIO if configuration changed
  ansible.builtin.systemd:
    name: minio
    state: restarted
  when: nas_setup_minio_env_updated.changed and not nas_setup_minio_service_updated.changed

- name: Wait for MinIO API to become responsive
  ansible.builtin.uri:
    url: "http://127.0.0.1:9000/minio/health/live"
    status_code: 200
  retries: 10
  delay: 3
  register: nas_setup_minio_health
  until: nas_setup_minio_health.status == 200

- name: Authenticate and provision Terraform state bucket on MinIO
  amazon.aws.s3_bucket:
    name: homelab-tf-state
    state: present
    # Enforce standard Object Locking parameters for native S3 transaction locks
    object_lock_enabled: true
    endpoint_url: "http://127.0.0.1:9000"
    aws_access_key: "{{ vault_minio_root_user }}"
    aws_secret_key: "{{ vault_minio_root_password }}"
