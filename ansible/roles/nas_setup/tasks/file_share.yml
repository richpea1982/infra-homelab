---
- name: Ensure NFS server utilities are installed
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Configure NFS exports for the storage datasets
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  register: nas_setup_nfs_exports_updated

- name: Reload NFS exports if configuration changed
  ansible.builtin.command: exportfs -ra
  when: nas_setup_nfs_exports_updated.changed

- name: Ensure NFS server service is running and enabled
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
