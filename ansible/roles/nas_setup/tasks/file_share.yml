---
- name: Ensure NFS server utilities are installed
  apt:
    name: nfs-kernel-server
    state: present

- name: Configure NFS exports for the storage datasets
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  register: nfs_exports_updated

- name: Reload NFS exports if configuration changed
  command: exportfs -ra
  when: nfs_exports_updated.changed

- name: Ensure NFS server service is running and enabled
  service:
    name: nfs-kernel-server
    state: started
    enabled: true
