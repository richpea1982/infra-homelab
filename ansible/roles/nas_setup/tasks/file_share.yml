---
- name: Ensure NFS server utilities are installed
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Configure NFS exports for the storage datasets
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports if configuration changed

- name: Ensure NFS server service is running and enabled
  ansible.builtin.service:
    name: nfs-kernel-server
    state: started
    enabled: true
