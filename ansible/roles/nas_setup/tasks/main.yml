---
- name: Execute NAS Setup with Privilege Escalation
  become: true
  block:
    - name: Update system and install NAS packages
      ansible.builtin.include_tasks: packages.yml

    - name: Configure ZFS Storage
      ansible.builtin.include_tasks: zfs.yml

    - name: Configure NFS Exports
      ansible.builtin.include_tasks: file_share.yml

    - name: Deploy Standalone MinIO Backend
      ansible.builtin.include_tasks: minio.yml
