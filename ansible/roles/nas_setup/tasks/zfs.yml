---
- name: Apply ZFS ARC limits to protect 8GB host memory
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    content: |
      options zfs zfs_arc_max=2147483648
      options zfs zfs_arc_min=1073741824
    owner: root
    group: root
    mode: "0644"
  notify: Update initramfs if ZFS configuration changed

- name: Ensure ZFS kernel module is loaded
  community.general.modprobe:
    name: zfs
    state: present

- name: Ensure parent mount directory exists
  ansible.builtin.file:
    path: "{{ nas_setup_nas_mount_point_base }}"
    state: directory
    mode: "0755"

- name: Check if ZFS pool already exists
  ansible.builtin.command: "zpool list {{ nas_setup_nas_pool_name }}"
  register: nas_setup_zpool_check
  failed_when: false
  changed_when: false

- name: Create RAID-Z2 ZPOOL with optimized NAS options
  ansible.builtin.command: >
    zpool create -f
    -o ashift=12
    -O compression=lz4
    -O xattr=sa
    -O acltype=posixacl
    -O atime=off
    -O mountpoint=none
    {{ nas_setup_nas_pool_name }} raidz2
    {{ nas_setup_zfs_raidz2_disks | join(' ') }}
  when: nas_setup_zpool_check.rc != 0
  changed_when: true

- name: Create ZFS Datasets with Tailored Options
  community.general.zfs:
    name: "{{ nas_setup_nas_pool_name }}/{{ item.name }}"
    state: present
    extra_zfs_properties:
      mountpoint: "{{ nas_setup_nas_mount_point_base }}/{{ item.name }}"
      recordsize: "{{ item.recordsize | default('128k') }}"
  loop: "{{ nas_setup_nas_datasets }}"

- name: Open permissions on datasets that need multi-client/non-root write access
  ansible.builtin.file:
    path: "{{ nas_setup_nas_mount_point_base }}/{{ item.name }}"
    state: directory
    mode: "0777"
  loop: "{{ nas_setup_nas_datasets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.world_writable | default(false)
# NEW: Seafile on K3s uses three static PVs (data / avatars / custom)
# against subdirectories of this one dataset, mirroring how
# seafile-containerized splits the docker volumes seafile-data,
# seahub-avatars, and seahub-custom. Kubernetes' static NFS PV type
# does not create the remote path itself — it must already exist, or
# the mount fails at pod start. Created here, once, idempotently,
# rather than as a manual one-off step outside IaC.
- name: Ensure seafile K3s subdirectories exist (data / avatars / custom)
  ansible.builtin.file:
    path: "{{ nas_setup_nas_mount_point_base }}/seafile/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0777" # seafile-server/seahub run as non-root inside their
  # containers with no explicit UID/GID pinning here yet —
  # open perms are the pragmatic starting point, same as
  # relying on no_root_squash on the export itself. Worth
  # tightening once the container's actual runtime UID is
  # confirmed (check via `kubectl exec ... -- id`).
  loop:
    - data
    - avatars
    - custom
