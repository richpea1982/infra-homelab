---
# Packages to install
nas_packages:
  - samba
  - samba-common-bin
  - nfs-kernel-server
  - zfsutils-linux
  - python3-boto3
# ZFS Configuration
nas_pool_name: "storage_pool"
nas_mount_point_base: "/mnt/storage"

zfs_raidz2_disks:
  - /dev/disk/by-id/ata-WDC_WD10JPVX-75JC3T0_WXK1E63ZHKV7
  - /dev/disk/by-id/ata-TOSHIBA_MQ01ABD100_37JOPUHTT
  - /dev/disk/by-id/ata-ST1000LM024_HN-M101MBB_S32XJ9GGC10989
  - /dev/disk/by-id/ata-TOSHIBA_MQ01ABD100_Y4MLP8TYT
  - /dev/disk/by-id/ata-TOSHIBA_MQ01ABD100_Y6SGCKJFT
  - /dev/disk/by-id/ata-TOSHIBA_MQ01ABD100_865XTG96T

# Grouping datasets with their optimized properties
# Note: minio is marked as local_only: true so NFS skips it
nas_datasets:
  # CHANGED: seafile is moving from the standalone LXC (local-only ZFS
  # mount) to K3s (seafile-server + seahub, custom images). Both pods
  # need concurrent RWX access to the same library data, so this is now
  # NFS-exported to VLAN20 (10.0.20.0/24) — same shape as the jellyfin
  # dataset's VLAN30 export, just a different destination VLAN because
  # the consumer is K3s pods, not an LXC. `sync` (not `async`) to match
  # jellyfin's VLAN30 export, since this is now backing a multi-writer
  # library rather than a read-mostly media share — worth the latency
  # cost for write integrity. `insecure` because the in-cluster NFS
  # client (kubelet, mounting on behalf of the pod) does not necessarily
  # originate from a privileged (<1024) source port.
  - name: "seafile"
    recordsize: "128k"
    exports:
      - subnet: "10.0.20.0/24"
        options: "rw,sync,no_subtree_check,no_root_squash,insecure"
  - name: "photoprism"
    recordsize: "128k"
    exports:
      - subnet: "10.0.20.0/24"
        options: "rw,sync,no_subtree_check,no_root_squash,insecure"
  - name: "minio"
    recordsize: "128k"
    local_only: true
  - name: "pbs-backups"
    recordsize: "1m"
  - name: "pve1-backups"
    recordsize: "1m"
  - name: "k3s-backups"
    recordsize: "1m"
  - name: "jellyfin"
    recordsize: "1m"
    exports:
      - subnet: "10.0.10.0/24"
        options: "rw,async,no_subtree_check,no_root_squash,crossmnt"
      - subnet: "10.0.30.0/24"
        options: "rw,sync,no_subtree_check,no_root_squash,insecure,crossmnt"
  - name: "jellyfin/dvds"
    recordsize: "1m"
    exports:
      - subnet: "10.0.10.0/24"
        options: "rw,async,no_subtree_check,no_root_squash"
      - subnet: "10.0.30.0/24"
        options: "rw,sync,no_subtree_check,no_root_squash,insecure"
  - name: "jellyfin/music"
    recordsize: "256k"
    exports:
      - subnet: "10.0.10.0/24"
        options: "rw,async,no_subtree_check,no_root_squash"
      - subnet: "10.0.30.0/24"
        options: "rw,sync,no_subtree_check,no_root_squash,insecure"

# MinIO Configuration
minio_download_url: "https://dl.min.io/server/minio/release/linux-amd64/minio"
minio_version: "RELEASE.2026-07-03T16-39-21Z"
minio_user: "minio"
minio_group: "minio"
